name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pull-request-gate:
    name: required
    needs: protected-linux-fixture
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require successful protected fixture prerequisite
        env:
          OCTON_PROTECTED_RESULT: ${{ needs.protected-linux-fixture.result }}
        run: test "$OCTON_PROTECTED_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate skill package metadata
        run: python -B skills/octon-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate benchmark and launcher remediation contracts
        run: |
          python -B skills/octon-project-bootstrap/scripts/test_benchmark_validation.py
          python -B skills/octon-project-bootstrap/scripts/test_octon_launchers.py
      - name: Validate Octon source and profile builds
        run: python -B skills/octon-project-bootstrap/scripts/validate_octon_mini.py
      - name: Run end-to-end and adversarial acceptance
        run: python -B skills/octon-project-bootstrap/scripts/test_acceptance.py

  protected-linux-fixture:
    name: protected Linux fixture
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify protected disposable Linux fixture
        run: |
          docker run --rm --network none --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add KILL \
            --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=512m \
            --tmpfs /evidence:rw,nosuid,nodev,size=64m \
            -e OCTON_OWNED_EPHEMERAL_CONTAINER=protected-fixture-v1 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/source \
            -v "$GITHUB_WORKSPACE:/source:ro" -w /source \
            python@sha256:4d1caded1f729ae443eb803f26ffde7b61e696aeaef62f099abb6dd6b14257c7 \
            python -B skills/octon-project-bootstrap/scripts/test_protected_fixture.py \
            --qualify-linux-container --output /evidence/qualification.json --emit-evidence

  main-smoke:
    name: main-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Validate skill package metadata
        run: python -B skills/octon-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate benchmark and launcher remediation contracts
        run: |
          python -B skills/octon-project-bootstrap/scripts/test_benchmark_validation.py
          python -B skills/octon-project-bootstrap/scripts/test_octon_launchers.py
      - name: Validate Octon source and profile builds
        run: python -B skills/octon-project-bootstrap/scripts/validate_octon_mini.py

  full-source-matrix:
    name: full source / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Probe native fixture authentication and portable paths
        run: python -B skills/octon-project-bootstrap/scripts/test_fixture_admission.py AdmissionTests.test_01_native_dependency_and_portable_paths_early
      - name: Validate skill package metadata
        run: python -B skills/octon-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate benchmark and launcher remediation contracts
        run: |
          python -B skills/octon-project-bootstrap/scripts/test_benchmark_validation.py
          python -B skills/octon-project-bootstrap/scripts/test_octon_launchers.py
      - name: Validate Octon source and profile builds
        run: python -B skills/octon-project-bootstrap/scripts/validate_octon_mini.py

  full-acceptance-matrix:
    name: full acceptance / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run end-to-end and adversarial acceptance
        run: python -B skills/octon-project-bootstrap/scripts/test_acceptance.py
