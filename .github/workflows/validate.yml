name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pull-request-gate:
    name: required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate skill package metadata
        run: python -B skills/octon-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate benchmark and launcher remediation contracts
        run: |
          python -B skills/octon-project-bootstrap/scripts/test_benchmark_validation.py
          python -B skills/octon-project-bootstrap/scripts/test_octon_launchers.py
      - name: Validate Octon source and profile builds
        run: python -B skills/octon-project-bootstrap/scripts/validate_octon_mini.py
      - name: Run end-to-end and adversarial acceptance
        run: python -B skills/octon-project-bootstrap/scripts/test_acceptance.py

  main-smoke:
    name: main-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Validate skill package metadata
        run: python -B skills/octon-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate benchmark and launcher remediation contracts
        run: |
          python -B skills/octon-project-bootstrap/scripts/test_benchmark_validation.py
          python -B skills/octon-project-bootstrap/scripts/test_octon_launchers.py
      - name: Validate Octon source and profile builds
        run: python -B skills/octon-project-bootstrap/scripts/validate_octon_mini.py

  full-source-matrix:
    name: full source / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Probe native fixture authentication and portable paths
        run: python -B skills/octon-project-bootstrap/scripts/test_fixture_admission.py AdmissionTests.test_01_native_dependency_and_portable_paths_early
      - name: Validate skill package metadata
        run: python -B skills/octon-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate benchmark and launcher remediation contracts
        run: |
          python -B skills/octon-project-bootstrap/scripts/test_benchmark_validation.py
          python -B skills/octon-project-bootstrap/scripts/test_octon_launchers.py
      - name: Validate Octon source and profile builds
        run: python -B skills/octon-project-bootstrap/scripts/validate_octon_mini.py

  full-acceptance-matrix:
    name: full acceptance / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run end-to-end and adversarial acceptance
        run: python -B skills/octon-project-bootstrap/scripts/test_acceptance.py
